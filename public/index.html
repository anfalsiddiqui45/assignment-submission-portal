<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Assignment Submission Portal</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="container">
    <h1>Assignment Submission Portal</h1>

    <section class="card">
      <h2>Submit Assignment</h2>
      <form id="submission-form" novalidate>
        <label>Name
          <input name="name" required>
          <span class="error" data-error="name"></span>
        </label>
        <label>Registration Number
          <input name="registrationNumber" required>
          <span class="error" data-error="registrationNumber"></span>
        </label>
        <label>Assignment Title
          <input name="assignmentTitle" required>
          <span class="error" data-error="assignmentTitle"></span>
        </label>
        <label>Submission URL
          <input name="submissionUrl" type="url" required placeholder="https://example.com/work">
          <span class="error" data-error="submissionUrl"></span>
        </label>
        <button type="submit">Submit Assignment</button>
        <p id="form-message" role="status"></p>
      </form>
    </section>

    <section class="card">
      <h2>Saved Submissions</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Registration</th><th>Title</th><th>Link</th></tr></thead>
          <tbody id="submissions"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
